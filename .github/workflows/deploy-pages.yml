name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

# GitHub Pages serves this repository from the gh-pages branch, so deploying is
# just mirroring main onto it. The official actions/deploy-pages route is not
# used because it requires the Pages source to be set to "GitHub Actions", and
# the built-in workflow token is not permitted to change that setting.
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Publish main to gh-pages
        run: git push origin HEAD:gh-pages
